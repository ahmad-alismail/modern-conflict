name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools/godot
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d .tools/godot
          chmod +x .tools/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Import project
        run: |
          touch .tools/.gdignore
          timeout 600 .tools/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --import || true

      - name: Parse-check all scripts
        run: .tools/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . -s res://tools/check.gd

      - name: Run test suite
        run: .tools/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . -s res://tests/run_tests.gd
